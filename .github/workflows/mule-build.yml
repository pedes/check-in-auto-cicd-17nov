name: Mule Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_to_exchange:
        description: Publish the POM version to Anypoint Exchange from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Package Mule application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require main for Exchange publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_exchange && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Select the main branch to publish to Anypoint Exchange."
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          overwrite-settings: false

      # Mule Maven Plugin 4.10.3 supports Maven through 3.9.15.
      - name: Set up Apache Maven
        env:
          MAVEN_VERSION: '3.9.15'
          MAVEN_SHA512: 33d81e0ec785f0207e3e5e3ffb61863e1dca5784c15ac3fb5ff105f69cffbea484eb8d473ea60467a63f7b0570eef8622f2fed8eee96acbe668aa313391cddb3
        run: |
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MAVEN_SHA512" "$archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Configure Maven settings for Exchange
        run: |
          cat > "$RUNNER_TEMP/exchange-settings.xml" <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>anypoint-exchange-v3-student-deployment</id>
                <username>~~~Client~~~</username>
                <password>${env.EXCHANGE_CLIENT_ID}~?~${env.EXCHANGE_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Build Mule application
        env:
          EXCHANGE_CLIENT_ID: ${{ secrets.EXCHANGE_READ_CLIENT_ID }}
          EXCHANGE_CLIENT_SECRET: ${{ secrets.EXCHANGE_READ_CLIENT_SECRET }}
        run: |
          settings=()
          if [[ -n "$EXCHANGE_CLIENT_ID" && -n "$EXCHANGE_CLIENT_SECRET" ]]; then
            settings=(--settings "$RUNNER_TEMP/exchange-settings.xml")
          else
            echo "Exchange credentials are unavailable. Maven will try to resolve dependencies anonymously."
          fi

          mvn -B -ntp "${settings[@]}" --file pom.xml -DskipTests clean package

      - name: Publish Mule application to Anypoint Exchange
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_exchange && github.ref == 'refs/heads/main'
        env:
          EXCHANGE_CLIENT_ID: ${{ secrets.EXCHANGE_PUBLISH_CLIENT_ID }}
          EXCHANGE_CLIENT_SECRET: ${{ secrets.EXCHANGE_PUBLISH_CLIENT_SECRET }}
        run: |
          if [[ -z "$EXCHANGE_CLIENT_ID" || -z "$EXCHANGE_CLIENT_SECRET" ]]; then
            echo "::error::Set EXCHANGE_PUBLISH_CLIENT_ID and EXCHANGE_PUBLISH_CLIENT_SECRET before publishing."
            exit 1
          fi

          # Without muleDeploy, the Mule Maven plugin publishes to distributionManagement.
          mvn -B -ntp --settings "$RUNNER_TEMP/exchange-settings.xml" --file pom.xml -DskipTests deploy
