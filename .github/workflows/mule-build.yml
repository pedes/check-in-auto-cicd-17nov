name: Mule Build and Exchange Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mule-exchange-publish
  queue: max

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and publish Mule application
    if: >-
      github.repository == 'pedes/check-in-auto-cicd-17nov'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: exchange
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          overwrite-settings: false

      # Mule Maven Plugin 4.10.3 supports Maven through 3.9.15.
      - name: Set up Apache Maven
        env:
          MAVEN_VERSION: '3.9.15'
          MAVEN_SHA512: 33d81e0ec785f0207e3e5e3ffb61863e1dca5784c15ac3fb5ff105f69cffbea484eb8d473ea60467a63f7b0570eef8622f2fed8eee96acbe668aa313391cddb3
        run: |
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MAVEN_SHA512" "$archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Configure Maven settings for Exchange
        run: |
          cat > "$RUNNER_TEMP/exchange-settings.xml" <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>anypoint-exchange-v3-student-deployment</id>
                <username>~~~Client~~~</username>
                <password>${env.EXCHANGE_CLIENT_ID}~?~${env.EXCHANGE_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Compile and package Mule application
        env:
          EXCHANGE_CLIENT_ID: ${{ secrets.EXCHANGE_READ_CLIENT_ID }}
          EXCHANGE_CLIENT_SECRET: ${{ secrets.EXCHANGE_READ_CLIENT_SECRET }}
        run: |
          if [[ -z "$EXCHANGE_CLIENT_ID" || -z "$EXCHANGE_CLIENT_SECRET" ]]; then
            echo "::error::Configure the shared Exchange credentials in the exchange environment."
            exit 1
          fi

          # Maven runs the compile phase on its way to package.
          mvn -B -ntp --settings "$RUNNER_TEMP/exchange-settings.xml" --file pom.xml -DskipTests clean package

      - name: Check whether the POM version exists in Exchange
        id: exchange_version
        env:
          EXCHANGE_CLIENT_ID: ${{ secrets.EXCHANGE_READ_CLIENT_ID }}
          EXCHANGE_CLIENT_SECRET: ${{ secrets.EXCHANGE_READ_CLIENT_SECRET }}
        run: |
          effective_pom="$RUNNER_TEMP/effective-pom.xml"
          mvn -B -ntp -q --settings "$RUNNER_TEMP/exchange-settings.xml" --file pom.xml \
            org.apache.maven.plugins:maven-help-plugin:3.5.1:effective-pom -Doutput="$effective_pom"

          asset_path="$(python3 - "$effective_pom" <<'PY'
          import sys
          from urllib.parse import quote
          from xml.etree import ElementTree

          project = ElementTree.parse(sys.argv[1])
          coordinates = [project.findtext(f"{{*}}{name}") for name in ("groupId", "artifactId", "version")]
          if not all(coordinates):
              raise SystemExit("The effective POM is missing Exchange asset coordinates.")
          print("/".join(quote(value, safe="") for value in coordinates))
          PY
          )"

          token="$(curl --fail --silent --show-error --max-time 30 \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "client_id=$EXCHANGE_CLIENT_ID" \
            --data-urlencode "client_secret=$EXCHANGE_CLIENT_SECRET" \
            'https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token' \
            | jq -er '.access_token | select(type == "string" and length > 0)')"
          printf '::add-mask::%s\n' "$token"

          status="$(curl --silent --show-error --max-time 30 --output /dev/null \
            --write-out '%{http_code}' --header "Authorization: Bearer $token" \
            "https://anypoint.mulesoft.com/exchange/api/v2/assets/$asset_path")"
          case "$status" in
            200)
              echo "Asset version already exists in Exchange. Skipping publish."
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Exchange asset lookup returned HTTP $status. Publishing was halted."
              exit 1
              ;;
          esac

      - name: Publish Mule application to Anypoint Exchange
        if: steps.exchange_version.outputs.exists == 'false'
        env:
          EXCHANGE_CLIENT_ID: ${{ secrets.EXCHANGE_READ_CLIENT_ID }}
          EXCHANGE_CLIENT_SECRET: ${{ secrets.EXCHANGE_READ_CLIENT_SECRET }}
        run: |
          # Without muleDeploy, the Mule Maven plugin publishes to distributionManagement.
          mvn -B -ntp --settings "$RUNNER_TEMP/exchange-settings.xml" --file pom.xml -DskipTests deploy
