name: Mule Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package Mule application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          overwrite-settings: false

      # Mule Maven Plugin 4.10.3 supports Maven through 3.9.15.
      - name: Set up Apache Maven
        env:
          MAVEN_VERSION: '3.9.15'
          MAVEN_SHA512: 33d81e0ec785f0207e3e5e3ffb61863e1dca5784c15ac3fb5ff105f69cffbea484eb8d473ea60467a63f7b0570eef8622f2fed8eee96acbe668aa313391cddb3
        run: |
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MAVEN_SHA512" "$archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build Mule application
        env:
          EXCHANGE_READ_CLIENT_ID: ${{ secrets.EXCHANGE_READ_CLIENT_ID }}
          EXCHANGE_READ_CLIENT_SECRET: ${{ secrets.EXCHANGE_READ_CLIENT_SECRET }}
        run: |
          settings="$RUNNER_TEMP/maven-settings.xml"

          # The API specification is resolved from the student Exchange repository.
          if [[ -n "$EXCHANGE_READ_CLIENT_ID" && -n "$EXCHANGE_READ_CLIENT_SECRET" ]]; then
            cat > "$settings" <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>anypoint-exchange-v3-student-deployment</id>
                <username>~~~Client~~~</username>
                <password>${env.EXCHANGE_READ_CLIENT_ID}~?~${env.EXCHANGE_READ_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          XML
          else
            echo "Exchange credentials are unavailable. Maven will try to resolve dependencies anonymously."
            printf '%s\n' '<settings/>' > "$settings"
          fi

          mvn -B -ntp --settings "$settings" --file pom.xml -DskipTests clean package
