name: Mule Build, Exchange Publish and Sandbox Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mule-exchange-publish
  queue: max

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and publish Mule application
    if: >-
      github.repository == 'pedes/check-in-auto-cicd-17nov'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: exchange
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          mvn-server-credentials: |
            anypoint-exchange-v3-student-deployment:CA_MAVEN_USERNAME:CA_MAVEN_PASSWORD
            releases-ee:RELEASES_EE_USERNAME:RELEASES_EE_PASSWORD

      - name: Compile and package Mule application
        env:
          RELEASES_EE_USERNAME: ${{ secrets.RELEASES_EE_USERNAME }}
          RELEASES_EE_PASSWORD: ${{ secrets.RELEASES_EE_PASSWORD }}
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
        run: |
          : "${RELEASES_EE_USERNAME:?Set RELEASES_EE_USERNAME}"
          : "${RELEASES_EE_PASSWORD:?Set RELEASES_EE_PASSWORD}"
          if [[ -z "$CA_CLIENT_ID" || -z "$CA_CLIENT_SECRET" ]]; then
            echo "::error::Set CA_CLIENT_ID and CA_CLIENT_SECRET for Exchange access."
            exit 1
          fi

          export CA_MAVEN_USERNAME='~~~Client~~~'
          export CA_MAVEN_PASSWORD="$CA_CLIENT_ID~?~$CA_CLIENT_SECRET"
          mvn -V -B -ntp -DskipTests clean package help:evaluate \
            -Dexpression=project.id -Doutput="$RUNNER_TEMP/maven-project-id"

      - name: Check whether the Mule application JAR is already in Exchange
        id: exchange_version
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
        run: |
          token="$(curl --fail --silent --show-error --max-time 30 \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "client_id=$CA_CLIENT_ID" \
            --data-urlencode "client_secret=$CA_CLIENT_SECRET" \
            'https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token' \
            | jq -er '.access_token | select(type == "string" and length > 0)')"
          printf '::add-mask::%s\n' "$token"

          # Maven project.id is groupId:artifactId:packaging:version.
          asset_path="$(jq -Rer 'split(":") as [$groupId, $artifactId, $packaging, $version]
            | select($packaging == "mule-application")
            | [$groupId, $artifactId, $version] | map(@uri) | join("/")' "$RUNNER_TEMP/maven-project-id")"
          asset_metadata="$RUNNER_TEMP/exchange-asset.json"
          status="$(curl --silent --show-error --max-time 30 --output "$asset_metadata" \
            --write-out '%{http_code}' --header "Authorization: Bearer $token" \
            "https://anypoint.mulesoft.com/exchange/api/v2/assets/$asset_path")"
          case "$status" in
            200)
              if ! jq -e '.type == "app" and any(.files[]?; .classifier == "mule-application" and .packaging == "jar")' \
                "$asset_metadata" > /dev/null 2>&1; then
                echo "::error::An Exchange asset occupies this version without a Mule application JAR."
                exit 1
              fi
              echo "This Mule application version is already in Exchange. Skipping publish."
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Exchange asset lookup returned HTTP $status. Publishing was halted."
              exit 1
              ;;
          esac

      - name: Publish Mule application to Anypoint Exchange
        if: steps.exchange_version.outputs.exists == 'false'
        env:
          RELEASES_EE_USERNAME: ${{ secrets.RELEASES_EE_USERNAME }}
          RELEASES_EE_PASSWORD: ${{ secrets.RELEASES_EE_PASSWORD }}
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
        run: |
          export CA_MAVEN_USERNAME='~~~Client~~~'
          export CA_MAVEN_PASSWORD="$CA_CLIENT_ID~?~$CA_CLIENT_SECRET"
          mvn -B -ntp -DskipTests deploy

  deploy_cloudhub:
    name: Deploy the published Mule app to CloudHub Sandbox
    needs: build
    environment: cloudhub-sandbox
    runs-on: ubuntu-26.04
    # Allow Maven's deployment verification to finish after runner setup.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          mvn-server-credentials: |
            clodhub-deploy:CA_MAVEN_USERNAME:CA_MAVEN_PASSWORD
            releases-ee:RELEASES_EE_USERNAME:RELEASES_EE_PASSWORD

      - name: Deploy the Exchange asset to CloudHub 2.0
        env:
          RELEASES_EE_USERNAME: ${{ secrets.RELEASES_EE_USERNAME }}
          RELEASES_EE_PASSWORD: ${{ secrets.RELEASES_EE_PASSWORD }}
          CLOUDHUB_APP_NAME: ${{ vars.CLOUDHUB_APP_NAME || 'check-in-proc-api-app' }}
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          ANYPOINT_PLATFORM_CLIENT_ID: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }}
          ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }}
          CLOUDHUB_ENCRYPT_KEY: ${{ secrets.CLOUDHUB_ENCRYPT_KEY }}
        run: |
          : "${CA_CLIENT_ID:?Set CA_CLIENT_ID}"
          : "${CA_CLIENT_SECRET:?Set CA_CLIENT_SECRET}"
          : "${ANYPOINT_PLATFORM_CLIENT_ID:?Set ANYPOINT_PLATFORM_CLIENT_ID}"
          : "${ANYPOINT_PLATFORM_CLIENT_SECRET:?Set ANYPOINT_PLATFORM_CLIENT_SECRET}"
          : "${CLOUDHUB_ENCRYPT_KEY:?Set CLOUDHUB_ENCRYPT_KEY}"

          export CA_MAVEN_USERNAME='~~~Client~~~'
          export CA_MAVEN_PASSWORD="$CA_CLIENT_ID~?~$CA_CLIENT_SECRET"
          mvn -V -B -ntp \
            -DapplicationName="$CLOUDHUB_APP_NAME" \
            -Danypoint.platform.client_id="$ANYPOINT_PLATFORM_CLIENT_ID" \
            -Danypoint.platform.client_secret="$ANYPOINT_PLATFORM_CLIENT_SECRET" \
            -Dencrypt.key="$CLOUDHUB_ENCRYPT_KEY" \
            mule:deploy
